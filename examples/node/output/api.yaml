openapi: "3.0.3"
info:
  title: Blog API
  version: "1.0.0"
components:
  schemas:
    BlogPost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        published:
          type: boolean
        views:
          type: integer
        rating:
          type: number
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
          type: string
          format: date-time
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string