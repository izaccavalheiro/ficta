name: Deploy Ficta Playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/**'
      - 'dist/**'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundles and playground
        run: npm run build

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          # Copy playground root files
          cp playground/index.html _site/
          cp playground/styles.css _site/
          # Copy built JS bundle (playground.js + ficta copy)
          mkdir -p _site/dist
          cp playground/dist/playground.js _site/dist/
          cp playground/dist/ficta.browser.min.js _site/dist/
          # Map sourcemaps if present
          cp playground/dist/playground.js.map _site/dist/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
